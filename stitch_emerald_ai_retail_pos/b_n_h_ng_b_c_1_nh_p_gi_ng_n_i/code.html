<!-- Main Microphone Button -->

<script>
  (function() {
    const micBtn = document.getElementById('mic-button');
    const micIcon = document.getElementById('mic-icon');
    const statusText = document.getElementById('status-text');
    const transcriptText = document.getElementById('transcript-text');
    const nextBtn = document.getElementById('next-button');
    const progressRing = document.getElementById('progress-ring');
    const recordingTime = document.getElementById('recording-time');
    const ripples = [
      document.getElementById('ripple-1'),
      document.getElementById('ripple-2'),
      document.getElementById('ripple-3')
    ];

    let isRecording = false;
    let timerInterval;
    let seconds = 0;

    const phrases = [
      "Đang lắng nghe âm thanh...",
      "2 cà phê sữa đá mang về",
      "Thêm 1 bánh mì kẹp thịt",
      "Tính tiền cho chị bàn số 5",
      "2 phở bò tái nạm, không hành"
    ];

    function toggleRecording() {
      isRecording = !isRecording;
      
      if (isRecording) {
        startRecordingUI();
      } else {
        stopRecordingUI();
      }
    }

    function startRecordingUI() {
      micBtn.classList.add('scale-110');
      micIcon.innerText = 'stop';
      statusText.innerText = 'Đang ghi âm...';
      statusText.classList.add('text-primary');
      recordingTime.classList.remove('hidden');
      transcriptText.innerText = '';
      transcriptText.classList.remove('italic');
      transcriptText.classList.add('text-on-surface');
      
      // Animate progress ring
      progressRing.style.strokeDashoffset = '0';
      
      // Start ripples
      ripples.forEach((r, i) => {
        r.animate([
          { transform: 'scale(1)', opacity: 0.5 },
          { transform: 'scale(2.5)', opacity: 0 }
        ], {
          duration: 2000,
          delay: i * 600,
          iterations: Infinity
        });
      });

      // Simulation of live transcription
      let wordIndex = 0;
      const interval = setInterval(() => {
        if (!isRecording) {
          clearInterval(interval);
          return;
        }
        transcriptText.innerText = phrases[wordIndex % phrases.length];
        wordIndex++;
      }, 1500);

      // Timer
      seconds = 0;
      timerInterval = setInterval(() => {
        seconds++;
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        recordingTime.innerText = `${m}:${s}`;
      }, 1000);
    }

    function stopRecordingUI() {
      micBtn.classList.remove('scale-110');
      micIcon.innerText = 'mic';
      statusText.innerText = 'Xử lý hoàn tất!';
      statusText.classList.remove('text-primary');
      statusText.classList.add('text-emerald-active');
      recordingTime.classList.add('hidden');
      
      progressRing.style.strokeDashoffset = '414.69';
      
      ripples.forEach(r => {
        r.getAnimations().forEach(anim => anim.cancel());
      });

      clearInterval(timerInterval);

      // Enable next button
      nextBtn.disabled = false;
      nextBtn.classList.remove('bg-cool-gray-muted', 'opacity-50', 'cursor-not-allowed');
      nextBtn.classList.add('bg-primary', 'shadow-lg', 'shadow-primary/20');
      
      if (transcriptText.innerText === '') {
        transcriptText.innerText = '2 phở bò, 1 trà đá. Thanh toán tiền mặt.';
      }
    }

    micBtn.addEventListener('click', toggleRecording);
  })();
